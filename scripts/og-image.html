<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 card shown when pragalvha.com is shared
  (LinkedIn, iMessage, X, Slack). To regenerate after editing, screenshot this file at a
  1200x630 viewport, e.g. with Playwright:
    page.set_viewport_size({"width": 1200, "height": 630}); page.goto("file://.../scripts/og-image.html")
    page.screenshot(path="public/og-image.png")
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=block"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background:
          radial-gradient(circle at top left, rgba(13, 122, 95, 0.1), transparent 38%),
          #f3efe6;
        color: #1c1914;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 84px;
      }
      .photo {
        width: 300px;
        height: 372px;
        flex-shrink: 0;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 1px 0 rgba(28, 25, 20, 0.08), 0 18px 40px -24px rgba(28, 25, 20, 0.45);
      }
      .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      h1 {
        font-family: "Newsreader", "Times New Roman", serif;
        font-weight: 500;
        font-size: 76px;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      .tagline { margin-top: 14px; font-size: 27px; color: #6b6458; }
      ul { list-style: none; margin-top: 34px; display: grid; gap: 14px; }
      li { display: flex; align-items: baseline; gap: 16px; font-size: 27px; line-height: 1.25; }
      li::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #0d7a5f;
        flex-shrink: 0;
        transform: translateY(-4px);
      }
      .url { margin-top: 36px; font-size: 22px; font-weight: 500; letter-spacing: 0.02em; color: #0d7a5f; }
    </style>
  </head>
  <body>
    <div class="photo"><img src="../public/profile-2026.png" alt="" /></div>
    <div>
      <h1>Pragalvha Sharma</h1>
      <p class="tagline">Building AI products</p>
      <ul>
        <li>AI Operations Engineering Intern, Opendoor</li>
        <li>Winner, xAI Hackathon (GrokHunt)</li>
        <li>1st globally, NASA/NSS Space Settlement Contest</li>
        <li>Computer Science at Western, business at Ivey</li>
      </ul>
      <p class="url">pragalvha.com</p>
    </div>
  </body>
</html>
