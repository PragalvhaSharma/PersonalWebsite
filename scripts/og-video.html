<!doctype html>
<!--
  Source for public/og-video.mp4, the looping clip iMessage plays in link previews.
  Prag's portrait sits beside a large "Prag." in Newsreader. The green period turns into a pen nib
  that rewinds the ink, then writes the name again stroke by stroke and lands back as the period.
  Loops every 7 seconds; frame 0 is the finished card, so it doubles as the still.
  To watch it live, run npx http-server from the repo root and open /scripts/og-video.html;
  render it with scripts/render-og-video.mjs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prag: og:video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f3efe6; }
  #stage {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(circle at top left, rgba(13,122,95,0.08), transparent 28%),
      #f3efe6;
  }
  #tile {
    position: absolute; left: 118px; top: 100px; width: 336px; height: 430px;
    border-radius: 32px; overflow: hidden; background: #2a2a2a;
    box-shadow: 0 0 0 1px rgba(28,25,20,0.12), 0 30px 60px -28px rgba(28,25,20,0.45), 0 8px 18px -10px rgba(28,25,20,0.25);
  }
  #tile img {
    position: absolute; left: -54px; top: 0; width: 444px; height: 430px;
    transform-origin: 50% 40%; display: block;
  }
  #ink { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; overflow: visible; }
  .glyph { font-family: "Newsreader", serif; font-weight: 500; font-size: 270px; fill: #1c1914; font-optical-sizing: auto; }
</style>
</head>
<body>
<div id="stage">
  <div id="tile"><img id="photo" src="../public/profile-2026.png" alt=""></div>
  <svg id="ink" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.1"/></filter>
    </defs>
    <text id="measure" class="glyph" x="0" y="-1000" style="letter-spacing:-0.035em">Prag</text>
    <g id="letters"></g>
    <g id="nib">
      <circle id="halo" r="22" fill="#0d7a5f" opacity="0.12"/>
      <circle id="dot" r="9" fill="#0d7a5f"/>
    </g>
  </svg>
</div>
<script>
(() => {
  const LOOP = 7;
  const FS = 270;          // font size of "Prag"
  const X0 = 506;          // left of "P"
  const BASE = 398;        // baseline, centered on the portrait tile
  const W = 0.19;          // pen width in em
  const NS = "http://www.w3.org/2000/svg";

  // Pen strokes per letter, in em units relative to the letter origin (x right, y down, baseline = 0).
  // Each letter is revealed by masking the real glyph with these strokes as they are drawn.
  const STROKES = [
    [ // P
      "M 0.035 -0.70 L 0.168 -0.70 L 0.168 -0.03",
      "M 0.035 -0.012 L 0.33 -0.012",
      "M 0.168 -0.70 L 0.36 -0.70 C 0.69 -0.70 0.69 -0.37 0.36 -0.37 L 0.19 -0.37"
    ],
    [ // r
      "M 0.025 -0.49 L 0.135 -0.52 L 0.135 -0.03",
      "M 0.02 -0.012 L 0.29 -0.012",
      "M 0.135 -0.33 C 0.17 -0.46 0.25 -0.515 0.33 -0.51 C 0.40 -0.505 0.40 -0.42 0.36 -0.40"
    ],
    [ // a
      "M 0.10 -0.42 C 0.12 -0.50 0.18 -0.525 0.25 -0.525 C 0.35 -0.525 0.385 -0.46 0.385 -0.36 L 0.385 -0.07 C 0.385 0.0 0.45 0.0 0.52 -0.04",
      "M 0.385 -0.29 C 0.22 -0.25 0.05 -0.21 0.05 -0.10 C 0.05 -0.02 0.11 0.01 0.19 0.01 C 0.28 0.01 0.35 -0.05 0.385 -0.11"
    ],
    [ // g
      "M 0.215 -0.17 C 0.12 -0.17 0.085 -0.25 0.085 -0.33 C 0.085 -0.42 0.14 -0.485 0.215 -0.485 C 0.30 -0.485 0.345 -0.42 0.345 -0.33 C 0.345 -0.24 0.30 -0.17 0.215 -0.17",
      "M 0.32 -0.46 L 0.42 -0.49 L 0.52 -0.50",
      "M 0.10 -0.19 C 0.05 -0.14 0.07 -0.08 0.15 -0.075 L 0.35 -0.07 C 0.47 -0.06 0.50 0.02 0.47 0.09 C 0.43 0.18 0.34 0.225 0.24 0.225 C 0.12 0.225 0.04 0.18 0.04 0.11 C 0.04 0.05 0.09 0.02 0.14 0.01"
    ]
  ];

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const easeInOutCubic = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const easeInOutSine = (u) => -(Math.cos(Math.PI * u) - 1) / 2;
  const lerp = (a, b, u) => a + (b - a) * u;

  let segs = [], letters = [], periodPt = null, startPt = null, landS = 1;
  const lx = [];
  const toCanvas = (i, p) => ({ x: lx[i] + p.x * FS, y: BASE + p.y * FS });

  function build() {
    const measure = document.getElementById("measure");
    const lettersG = document.getElementById("letters");
    const defs = document.querySelector("#ink defs");
    const chars = "Prag";
    const ends = [];
    for (let i = 0; i < 4; i++) {
      lx.push(X0 + measure.getStartPositionOfChar(i).x);
      ends.push(X0 + measure.getEndPositionOfChar(i).x);
    }
    for (let i = 0; i < 4; i++) {
      const mask = document.createElementNS(NS, "mask");
      mask.id = "m" + i; mask.setAttribute("maskUnits", "userSpaceOnUse");
      mask.setAttribute("x", "0"); mask.setAttribute("y", "0"); mask.setAttribute("width", "1200"); mask.setAttribute("height", "630");
      const mg = document.createElementNS(NS, "g");
      mg.setAttribute("filter", "url(#soft)");
      const inner = document.createElementNS(NS, "g");
      inner.setAttribute("transform", "translate(" + lx[i] + " " + BASE + ") scale(" + FS + ")");
      mg.appendChild(inner); mask.appendChild(mg); defs.appendChild(mask);
      const paths = STROKES[i].map((d) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#fff");
        p.setAttribute("stroke-width", String(W)); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
        inner.appendChild(p);
        return p;
      });
      const mkText = () => {
        const tx = document.createElementNS(NS, "text");
        tx.setAttribute("class", "glyph"); tx.setAttribute("x", String(lx[i])); tx.setAttribute("y", String(BASE));
        tx.textContent = chars[i];
        return tx;
      };
      // "masked" shows the ink laid down so far; "full" fades in once a letter's strokes finish,
      // filling the small corners the pen paths do not cover.
      const masked = mkText(); masked.setAttribute("mask", "url(#m" + i + ")");
      const full = mkText(); full.setAttribute("opacity", "0");
      lettersG.appendChild(full); lettersG.appendChild(masked);
      letters.push({ masked, full, paths, endS: 0 });
    }
    // Sequence of ink strokes and pen-in-air moves, measured so the pen keeps an even speed.
    const AIR = 0.55;
    let prev = null;
    letters.forEach((lt, i) => {
      lt.paths.forEach((p) => {
        const L = p.getTotalLength();
        const a = toCanvas(i, p.getPointAtLength(0));
        const b = toCanvas(i, p.getPointAtLength(L));
        if (prev) segs.push({ air: true, from: prev, to: a, len: Math.hypot(a.x - prev.x, a.y - prev.y) * AIR });
        segs.push({ air: false, letter: i, p, L, len: L * FS });
        prev = b;
      });
    });
    startPt = toCanvas(0, letters[0].paths[0].getPointAtLength(0));
    periodPt = { x: ends[3] + 0.075 * FS, y: BASE - 0.045 * FS };
    segs.push({ air: true, from: prev, to: periodPt, len: Math.hypot(periodPt.x - prev.x, periodPt.y - prev.y) * AIR });
    let total = 0;
    for (const s of segs) { s.a = total; total += s.len; }
    for (const s of segs) { s.s0 = s.a / total; s.s1 = (s.a + s.len) / total; }
    letters.forEach((lt, i) => { lt.endS = segs.filter((s) => !s.air && s.letter === i).pop().s1; });
    landS = segs[segs.length - 1].s0;
  }

  // Draw the ink for writing progress s in [0, 1] and return where the nib is.
  function ink(s) {
    let nib = startPt, inAir = false;
    for (const seg of segs) {
      if (seg.air) {
        if (s >= seg.s0 && s < seg.s1) {
          const u = (s - seg.s0) / (seg.s1 - seg.s0);
          const e = easeInOutSine(u);
          nib = { x: lerp(seg.from.x, seg.to.x, e), y: lerp(seg.from.y, seg.to.y, e) - Math.sin(Math.PI * u) * 10 };
          inAir = true;
        }
        continue;
      }
      const vis = clamp((s - seg.s0) / (seg.s1 - seg.s0)) * seg.L;
      const p = seg.p;
      if (vis < 1e-4) p.setAttribute("visibility", "hidden");
      else {
        p.setAttribute("visibility", "visible");
        p.setAttribute("stroke-dasharray", vis + " " + (seg.L * 3 + 1));
        p.setAttribute("stroke-dashoffset", "0");
      }
      if (s >= seg.s0 && s < seg.s1) nib = toCanvas(seg.letter, p.getPointAtLength(vis));
    }
    if (s >= 1) nib = periodPt;
    letters.forEach((lt) => {
      lt.full.setAttribute("opacity", smooth(lt.endS - 0.01, Math.min(lt.endS + 0.06, 0.995), s).toFixed(4));
    });
    // The nib is smaller in the air and grows into the period as it lands.
    const land = smooth(landS + (1 - landS) * 0.55, 1, s);
    return { nib, rNib: lerp(inAir ? 9 : 11, 13, land), land };
  }

  const els = {};
  function render(tRaw) {
    const t = ((tRaw % LOOP) + LOOP) % LOOP;
    // Writing progress: hold the finished name, rewind, pause, write it again, hold.
    let s;
    if (t < 1.35) s = 1;
    else if (t < 2.5) s = 1 - easeInOutCubic((t - 1.35) / 1.15);
    else if (t < 2.85) s = 0;
    else if (t < 5.15) s = easeInOutSine((t - 2.85) / 2.3);
    else s = 1;
    const st = ink(s);
    // The nib pulses gently while it waits at the start.
    const pulse = t >= 2.45 && t < 2.95 ? Math.sin(Math.PI * (t - 2.45) / 0.5) : 0;
    els.dot.setAttribute("cx", st.nib.x.toFixed(2)); els.dot.setAttribute("cy", st.nib.y.toFixed(2));
    els.dot.setAttribute("r", (st.rNib + pulse * 2).toFixed(2));
    els.halo.setAttribute("cx", st.nib.x.toFixed(2)); els.halo.setAttribute("cy", st.nib.y.toFixed(2));
    els.halo.setAttribute("opacity", ((1 - st.land) * 0.14 + pulse * 0.06).toFixed(4));
    els.halo.setAttribute("r", (24 + pulse * 6).toFixed(2));
    // The portrait breathes very slowly, seamless over the loop.
    const breath = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / LOOP);
    els.photo.style.transform = "scale(" + (1.0 + 0.018 * breath).toFixed(5) + ")";
  }

  window.__LOOP = LOOP;
  window.__render = render;
  window.__ready = (async () => {
    const img = document.getElementById("photo");
    // Fail loudly: a missing font would quietly fall back to another serif and
    // misalign the pen masks, and a missing portrait would ship a blank tile.
    const [faces] = await Promise.all([
      document.fonts.load('500 270px "Newsreader"'),
      img.decode()
    ]);
    if (!faces.length) throw new Error("Newsreader 500 did not load (Google Fonts unreachable?)");
    if (!img.naturalWidth) throw new Error("Portrait did not load: " + img.src);
    await document.fonts.ready;
    els.dot = document.getElementById("dot"); els.halo = document.getElementById("halo");
    els.photo = img;
    build();
    render(0);
  })();

  if (!location.search.includes("capture")) {
    window.__ready.then(() => {
      const t0 = performance.now();
      const tick = (now) => { render((now - t0) / 1000); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  }
})();
</script>
</body>
</html>
