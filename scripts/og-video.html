<!doctype html>
<!--
  Source for public/og-video.mp4, the looping clip iMessage plays in link previews.
  A ripple runs out from the center of a grid of pillars and loops every 3 seconds.
  To watch it live, run npx http-server from the repo root and open /scripts/og-video.html;
  render it with scripts/render-og-video.mjs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f3efe6; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const W = 1200, H = 630;
      const LOOP = 3;          // seconds; one ripple period
      const N = 34;            // pillars per side
      const PITCH = 1;         // distance between pillar centers
      const SIZE = 0.86;       // pillar width
      const AMP = 1.7;         // ripple height
      const K = 0.56;          // ripple spatial frequency (radians per unit)

      const PAPER = new THREE.Color("#f3efe6");
      const BASE = new THREE.Color("#ece7de");
      const GREEN = new THREE.Color("#0d7a5f");

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(W, H);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = PAPER.clone();
      scene.fog = new THREE.Fog(PAPER.clone(), 20, 40);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
      camera.position.set(12.5, 11.5, 12.5);
      camera.lookAt(0, -0.4, 0);

      const sun = new THREE.DirectionalLight("#fff8ef", 3.2);
      sun.position.set(-11, 13, 7);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      const sc = sun.shadow.camera;
      sc.left = -22; sc.right = 22; sc.top = 22; sc.bottom = -22; sc.near = 1; sc.far = 60;
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.02;
      sun.shadow.radius = 5;
      scene.add(sun);
      scene.add(new THREE.HemisphereLight("#fffaf0", "#cfc3ad", 0.35));

      const geo = new RoundedBoxGeometry(SIZE, 8, SIZE, 5, 0.14);
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0 });
      const mesh = new THREE.InstancedMesh(geo, mat, N * N);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const cells = [];
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          const x = (i - (N - 1) / 2) * PITCH;
          const z = (j - (N - 1) / 2) * PITCH;
          cells.push({ x, z, r: Math.hypot(x, z) });
        }
      }

      const m4 = new THREE.Matrix4();
      const col = new THREE.Color();
      const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

      function render(t) {
        t = ((t % LOOP) + LOOP) % LOOP;
        const ph = (2 * Math.PI * t) / LOOP;
        cells.forEach((c, idx) => {
          // Outward ripple: a crest leaves the center every LOOP seconds. Damped with distance
          // so the far field calms down, and shaped (raised to a power) so crests are sharp
          // and troughs are wide and flat, which reads more like a drop than a sine field.
          const w = 0.5 + 0.5 * Math.cos(K * c.r - ph);
          const damp = 0.35 + 0.65 * Math.exp(-c.r / 14);
          const s = Math.pow(w, 2.2) * damp;
          const y = s * AMP;
          m4.makeTranslation(c.x, y - 4, c.z);
          mesh.setMatrixAt(idx, m4);
          col.copy(BASE).lerp(GREEN, smooth(0.3, 0.85, s));
          mesh.setColorAt(idx, col);
        });
        mesh.instanceMatrix.needsUpdate = true;
        mesh.instanceColor.needsUpdate = true;
        renderer.render(scene, camera);
      }

      window.__LOOP = LOOP;
      window.__render = render;
      window.__ready = Promise.resolve(true);
      render(0);

      if (!location.search.includes("capture")) {
        const start = performance.now();
        const tick = (now) => { render((now - start) / 1000); requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    </script>
  </body>
</html>
