<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Brand Campaign Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="frameB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="frameC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="frameD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <ellipse cx="800" cy="400" rx="900" ry="500" fill="url(#glow)"/>

  <!-- Film strip top sprocket holes -->
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="120" y="120" width="36" height="22" rx="4"/>
    <rect x="220" y="120" width="36" height="22" rx="4"/>
    <rect x="320" y="120" width="36" height="22" rx="4"/>
    <rect x="420" y="120" width="36" height="22" rx="4"/>
    <rect x="520" y="120" width="36" height="22" rx="4"/>
    <rect x="620" y="120" width="36" height="22" rx="4"/>
    <rect x="720" y="120" width="36" height="22" rx="4"/>
    <rect x="820" y="120" width="36" height="22" rx="4"/>
    <rect x="920" y="120" width="36" height="22" rx="4"/>
    <rect x="1020" y="120" width="36" height="22" rx="4"/>
    <rect x="1120" y="120" width="36" height="22" rx="4"/>
    <rect x="1220" y="120" width="36" height="22" rx="4"/>
    <rect x="1320" y="120" width="36" height="22" rx="4"/>
    <rect x="1420" y="120" width="36" height="22" rx="4"/>
  </g>

  <!-- Film strip bottom sprocket holes -->
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="120" y="658" width="36" height="22" rx="4"/>
    <rect x="220" y="658" width="36" height="22" rx="4"/>
    <rect x="320" y="658" width="36" height="22" rx="4"/>
    <rect x="420" y="658" width="36" height="22" rx="4"/>
    <rect x="520" y="658" width="36" height="22" rx="4"/>
    <rect x="620" y="658" width="36" height="22" rx="4"/>
    <rect x="720" y="658" width="36" height="22" rx="4"/>
    <rect x="820" y="658" width="36" height="22" rx="4"/>
    <rect x="920" y="658" width="36" height="22" rx="4"/>
    <rect x="1020" y="658" width="36" height="22" rx="4"/>
    <rect x="1120" y="658" width="36" height="22" rx="4"/>
    <rect x="1220" y="658" width="36" height="22" rx="4"/>
    <rect x="1320" y="658" width="36" height="22" rx="4"/>
    <rect x="1420" y="658" width="36" height="22" rx="4"/>
  </g>

  <!-- Four video frames (campaign scenes) -->
  <g>
    <!-- Frame 1: Pink avatar -->
    <rect x="160" y="200" width="320" height="400" rx="18" fill="#16161f" stroke="url(#frameA)" stroke-width="3"/>
    <circle cx="320" cy="370" r="74" fill="url(#frameA)" fill-opacity="0.25" stroke="url(#frameA)" stroke-width="2.5"/>
    <circle cx="320" cy="345" r="28" fill="url(#frameA)"/>
    <path d="M 268 430 Q 320 380 372 430 L 372 460 L 268 460 Z" fill="url(#frameA)"/>
    <rect x="200" y="510" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="200" y="530" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.28"/>

    <!-- Frame 2: Blue avatar -->
    <rect x="520" y="200" width="320" height="400" rx="18" fill="#16161f" stroke="url(#frameB)" stroke-width="3"/>
    <circle cx="680" cy="370" r="74" fill="url(#frameB)" fill-opacity="0.25" stroke="url(#frameB)" stroke-width="2.5"/>
    <circle cx="680" cy="345" r="28" fill="url(#frameB)"/>
    <path d="M 628 430 Q 680 380 732 430 L 732 460 L 628 460 Z" fill="url(#frameB)"/>
    <rect x="560" y="510" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="560" y="530" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.28"/>

    <!-- Frame 3: Amber avatar -->
    <rect x="880" y="200" width="320" height="400" rx="18" fill="#16161f" stroke="url(#frameC)" stroke-width="3"/>
    <circle cx="1040" cy="370" r="74" fill="url(#frameC)" fill-opacity="0.25" stroke="url(#frameC)" stroke-width="2.5"/>
    <circle cx="1040" cy="345" r="28" fill="url(#frameC)"/>
    <path d="M 988 430 Q 1040 380 1092 430 L 1092 460 L 988 460 Z" fill="url(#frameC)"/>
    <rect x="920" y="510" width="180" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="920" y="530" width="125" height="8" rx="4" fill="#ffffff" fill-opacity="0.28"/>

    <!-- Frame 4: Green avatar -->
    <rect x="1240" y="200" width="320" height="400" rx="18" fill="#16161f" stroke="url(#frameD)" stroke-width="3"/>
    <circle cx="1400" cy="370" r="74" fill="url(#frameD)" fill-opacity="0.25" stroke="url(#frameD)" stroke-width="2.5"/>
    <circle cx="1400" cy="345" r="28" fill="url(#frameD)"/>
    <path d="M 1348 430 Q 1400 380 1452 430 L 1452 460 L 1348 460 Z" fill="url(#frameD)"/>
    <rect x="1280" y="510" width="160" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="1280" y="530" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.28"/>
  </g>
</svg>
